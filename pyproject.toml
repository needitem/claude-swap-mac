[project]
name = "cswap-dashboard"
version = "0.1.0"
description = "macOS menu bar + window dashboard for claude-swap account usage"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["claude", "claude-code", "macos", "menubar", "dashboard"]
dependencies = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-WebKit>=10.0",
]
classifiers = [
    "Environment :: MacOS X :: Cocoa",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
]

# claude-swap itself is deliberately NOT a dependency. The dashboard shells out
# to the `cswap` CLI and reads its documented --json output, so the two are
# installed and upgraded independently and this package never has to track
# upstream's internals.

[project.scripts]
cswap-dashboard = "cswap_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cswap_dashboard"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
